<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
      charset="UTF-8"
    />
    <title>Cooking for Clankers</title>

    <link rel="stylesheet" href="css/index.css" />
    <script src="components/header.js"></script>
    <script type="module" src="components/recipe-card.js"></script>
    <script src="components/footer.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="js/theme-toggle.js" defer></script>

    <script type="module" src="js/search.js"></script>
  </head>
  <body>
    <a id="top"></a>
    <header-component></header-component>

    <main class="container">
      <form id="filters">
        <fieldset>
          <legend>Filters</legend>
          <div class="mb-3">
            <label for="season" class="form-label">Season: </label>
            <select name="season" id="season" class="form-select">
              <option>Any</option>
              <option>All</option>
              <option>Spring</option>
              <option>Summer</option>
              <option>Autumn</option>
              <option>Winter</option>
            </select>
            <label for="category" class="form-label">Category: </label>
            <select name="category" id="category" class="form-select">
              <option>Any</option>
              <option>Appetizers</option>
              <option>Autumn</option>
              <option>Beverages</option>
              <option>Breakfast</option>
              <option>Desserts</option>
              <option>Dinner</option>
              <option>Lunch</option>
              <option>Snacks</option>
              <option>Spring</option>
              <option>Summer</option>
              <option>Winter</option>
            </select>
          </div>
        </fieldset>
      </form>
      <br />

      <h3>
        <label>Search results for: <input id="searchSpan" /></label>
      </h3>
      <p>
        Showing <span id="shownCount"></span> of
        <span id="totalCount"></span> results found.
      </p>
      <div class="row row-cols-1 row-cols-sm-2 g-2" id="mainColumn"></div>

      <div class="d-flex justify-content-evenly mt-4">
        <div id="loadMoreCol">
          <button id="loadMore" class="btn btn-outline-light">Load More</button>
        </div>
        <div>
          <a href="#top" class="btn btn-outline-light">Back to Top</a>
        </div>
      </div>
    </main>

    <footer-component></footer-component>
  </body>
</html>
