<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
      charset="UTF-8"
    />
    <title>Cooking for Clankers</title>

    <link rel="stylesheet" href="css/index.css" />
    <script src="components/header.js"></script>
    <script type="module" src="components/recipe-card.js"></script>
    <script src="components/footer.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>

    <script type="module" src="js/search.js"></script>
  </head>
  <body>
    <a id="top"></a>
    <header-component></header-component>

    <main class="container text-center">
      <h3>Search results for: <span id="searchSpan"></span></h3>
      <p>
        Showing <span id="shownCount"></span> of
        <span id="totalCount"></span> results found.
      </p>
      <div
        class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-2"
        id="mainColumn"
      ></div>

      <div class="row">
        <div id="loadMoreCol" class="col">
          <button id="loadMore" class="btn btn-outline-light">Load More</button>
        </div>
        <div class="col">
          <a href="#top" class="btn btn-outline-light">Back to Top</a>
        </div>
      </div>
    </main>

    <footer-component></footer-component>
  </body>
</html>
