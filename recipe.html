<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
      charset="UTF-8"
    />
    <title>Cooking for Clankers</title>

    <link rel="stylesheet" href="css/generic.css" />
    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
    <script type="module" src="js/recipe_page.js" defer></script>
  </head>
  <body>
    <header-component></header-component>

    <main class="container">
      <div class="card mb-3">
        <div class="row">
          <div class="col-4 recipe-img-final"></div>
          <div class="col-8">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <h3 class="card-title recipe-name">Loading...</h3>
                <div>
                  <button id="shareBtn" class="btn btn-outline-light">
                    Share
                  </button>
                  <i class="favorite-btn" role="button"></i>
                </div>
              </div>
              <p class="recipe-story"></p>
              <p class="card-text">
                Category: <span class="recipe-category"></span>
              </p>
              <p class="card-text">Dietary</p>
              <ul class="recipe-dietary"></ul>
              <p class="card-text">
                Season: <span class="recipe-season"></span>
              </p>
              <p class="card-text">
                Cuisine: <span class="recipe-cuisine"></span>
              </p>
              <p class="card-text">
                Prep Time: <span class="recipe-prep-time"></span>
              </p>
              <p class="card-text">
                Difficulty: <span class="recipe-difficulty"></span>
              </p>
              <h6 class="card-text">
                Ingredients
                <label>
                  <!-- TODO does this need a button to be obvious? -->
                  (multiply by <input
                    id="mulInput"
                    required
                    type="number"
                    value="1"
                  /> </label
                >)
              </h6>
              <ul class="recipe-ingredients"></ul>
              <h6 class="card-text">Steps</h6>
              <ol class="recipe-steps"></ol>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer-component></footer-component>
  </body>
</html>
